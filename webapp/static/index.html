<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Web App giao việc website và truyền thông IAICT — giao việc, duyệt và đăng bài đa kênh.">
  <title>Giao Việc IAICT</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css?v=0.5.1">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ======================= ĐĂNG NHẬP ======================= -->
  <main id="loginView" class="login-wrap" hidden>
    <section class="login-card">
      <div class="brand brand-center">
        <img src="/icon.svg" alt="" class="brand-icon">
        <div>
          <h1>Giao Việc IAICT</h1>
          <p>Giao việc · Duyệt bài · Đăng đa kênh</p>
        </div>
      </div>
      <form id="loginForm" class="form-stack">
        <label>Email hoặc số điện thoại
          <input id="loginInput" autocomplete="username" required placeholder="vd: ten@cong-ty.vn hoặc 09xx xxx xxx">
        </label>
        <label>Mật khẩu
          <input id="passwordInput" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu">
        </label>
        <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
        <p id="loginError" class="error-text" role="alert"></p>
      </form>
      <p class="muted small center">Tài khoản do Admin cấp. Quên mật khẩu, liên hệ Admin để được cấp lại.</p>
    </section>
  </main>

  <!-- =========================== APP =========================== -->
  <div id="appView" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <img src="/icon.svg" alt="" class="brand-icon">
        <div>
          <strong>Giao Việc IAICT</strong>
          <span>Web App truyền thông</span>
        </div>
      </div>
      <nav id="sideNav" class="side-nav" aria-label="Điều hướng chính"></nav>
      <div class="side-user">
        <div class="avatar" id="sideAvatar">?</div>
        <div class="side-user-info">
          <strong id="sideUserName">—</strong>
          <span id="sideUserRole">—</span>
        </div>
        <button id="passwordBtn" class="icon-btn" title="Đổi mật khẩu" aria-label="Đổi mật khẩu">🔐</button>
        <button id="logoutBtn" class="icon-btn" title="Đăng xuất" aria-label="Đăng xuất">🚪</button>
      </div>
      <button id="sideCollapseBtn" class="side-collapse" title="Thu gọn sidebar" aria-label="Thu gọn sidebar">◀ Thu gọn</button>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="brand brand-mobile">
          <img src="/icon.svg" alt="" class="brand-icon small-icon">
          <strong>Giao Việc IAICT</strong>
        </div>
        <div class="topbar-actions">
          <button id="bellBtn" class="icon-btn bell" title="Thông báo" aria-label="Thông báo">🔔<span id="bellBadge" class="badge" hidden>0</span></button>
          <button id="passwordBtnMobile" class="icon-btn" title="Đổi mật khẩu" aria-label="Đổi mật khẩu">🔐</button>
          <button id="logoutBtnMobile" class="icon-btn" title="Đăng xuất" aria-label="Đăng xuất">🚪</button>
        </div>
      </header>
      <nav id="mobileNav" class="mobile-nav" aria-label="Điều hướng di động"></nav>
      <main id="screen" class="screen" tabindex="-1"></main>
    </div>

    <nav id="bottomNav" class="bottom-nav" aria-label="Điều hướng dưới"></nav>
    <div id="moreScrim" class="more-scrim" hidden></div>
    <div id="moreSheet" class="more-sheet" role="menu" aria-label="Menu thêm" hidden></div>
  </div>

  <div id="modalRoot"></div>
  <script src="/app.js?v=0.5.1" defer></script>
</body>
</html>
